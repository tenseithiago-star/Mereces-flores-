<meta charset="UTF-8">    
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">  <title>Mereces Flores ❤️</title>  <link rel="preconnect" href="https://fonts.googleapis.com">    
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Press+Start+2P&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">  <style>    :root{
--rosa:#ff6b9d;
--rosa-fuerte:#e63971;
--lavanda:#b8a9f5;
--menta:#a8e6cf;
--crema:#fff7f0;
--texto:#4a2545;
}

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,
body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
background:#0b1535;
font-family:'Quicksand',sans-serif;
color:var(--texto);
touch-action:none;
}

button{
font-family:'Quicksand',sans-serif;
font-weight:700;
border:0;
outline:0;
cursor:pointer;
}

/* ============================================================
BOTÓN PRINCIPAL
============================================================ */

.btn-principal{
font-family:'Press Start 2P',monospace;
font-size:13px;
padding:16px 26px;
color:white;

background:
linear-gradient(
180deg,
#ff79a8,
#e63971
);

border-radius:14px;

box-shadow:
0 5px 0 #a82454,
0 8px 18px rgba(230,57,113,.35);

transition:
transform .12s ease,
box-shadow .12s ease;
}

.btn-principal:active{
transform:translateY(3px);
box-shadow:0 2px 0 #a82454;
}

/* ============================================================
PANTALLAS
============================================================ */

#startScreen,
#victoryScreen,
#letterScreen{
position:fixed;
inset:0;
z-index:50;

display:flex;
flex-direction:column;
align-items:center;
justify-content:center;

text-align:center;
padding:24px;

overflow:hidden;
}

/* ============================================================
PORTADA
============================================================ */

#startScreen{
background:#0b1535;
}

.portada{
position:relative;

width:min(58vw,360px);
height:min(82vh,620px);

display:flex;
flex-direction:column;
align-items:center;
justify-content:center;

overflow:hidden;

background:
radial-gradient(
circle at 50% 25%,
rgba(80,110,180,.22),
transparent 35%
),
linear-gradient(
160deg,
#101b42,
#182b5c 55%,
#0b1535
);

border:1px solid rgba(255,255,255,.18);

box-shadow:
0 25px 70px rgba(7,15,45,.45),
inset 0 0 70px rgba(255,255,255,.04);
}

.portada.abrir-libro{
animation:
abrirLibro .8s ease-in-out forwards;

transform-origin:left center;
perspective:1200px;
}

@keyframes abrirLibro{

0%{
transform:
perspective(1200px)
rotateY(0deg);

opacity:1;
}

45%{
transform:
perspective(1200px)
rotateY(-35deg);

opacity:1;
}

100%{
transform:
perspective(1200px)
rotateY(-88deg);

opacity:0;
}
}

/* ============================================================
ESTRELLAS
============================================================ */

.estrellas-portada{
position:absolute;
inset:0;
z-index:1;
pointer-events:none;
}

.estrella{
position:absolute;

width:4px;
height:4px;

border-radius:50%;

background:white;

box-shadow:
0 0 9px rgba(255,255,255,.8);

animation:
brilloEstrella 3s ease-in-out infinite;
}

.estrella-1{left:7%;top:8%}
.estrella-2{left:18%;top:16%;animation-delay:.8s}
.estrella-3{left:31%;top:6%;animation-delay:1.4s}
.estrella-4{left:45%;top:13%;animation-delay:2s}
.estrella-5{left:60%;top:7%;animation-delay:2.5s}
.estrella-6{left:74%;top:17%;animation-delay:.4s}
.estrella-7{left:87%;top:8%;animation-delay:1.1s}
.estrella-8{left:94%;top:25%;animation-delay:1.8s}
.estrella-9{left:5%;top:31%;animation-delay:2.3s}
.estrella-10{left:14%;top:39%;animation-delay:1.6s}
.estrella-11{left:83%;top:38%;animation-delay:2.7s}
.estrella-12{left:4%;top:55%;animation-delay:.9s}
.estrella-13{left:91%;top:57%;animation-delay:1.7s}
.estrella-14{left:11%;top:72%;animation-delay:2.4s}
.estrella-15{left:84%;top:70%;animation-delay:.6s}
.estrella-16{left:23%;top:88%;animation-delay:1.9s}
.estrella-17{left:72%;top:91%;animation-delay:2.8s}
.estrella-18{left:38%;top:82%;animation-delay:1.2s}
.estrella-19{left:57%;top:86%;animation-delay:2.2s}
.estrella-20{left:96%;top:88%;animation-delay:.7s}

@keyframes brilloEstrella{

0%,100%{
opacity:.3;
transform:scale(.8);
}

50%{
opacity:1;
transform:scale(1.5);
}
}

/* ============================================================
LIRIOS PORTADA
============================================================ */

.lirios-portada{
position:absolute;
z-index:2;

top:13%;
left:50%;

width:86%;
height:150px;

transform:
translateX(-50%)
rotate(-6deg);

filter:
drop-shadow(
0 0 14px rgba(255,255,255,.18)
);
}

.lirios-portada .lirio{
width:58px;
height:58px;

fill:transparent !important;

stroke:
rgba(255,255,255,.92);

stroke-width:1.8;
}

.lirios-portada .lirio path{
fill:transparent !important;
stroke:
rgba(255,255,255,.92);
}

.lirio-1{
position:absolute;
left:8%;
top:55px;
transform:
rotate(-18deg)
scale(.78);
}

.lirio-2{
position:absolute;
left:44%;
top:0;
transform:
scale(.68)
rotate(8deg);
}

.lirio-3{
position:absolute;
right:6%;
top:58px;
transform:
scale(.82)
rotate(20deg);
}

/* ============================================================
PORTADA TEXTO
============================================================ */

.titulo-portada{
position:relative;
z-index:4;

margin:0;

color:white;

font-family:
'Cormorant Garamond',
serif;

font-size:
clamp(38px,8vw,62px);

font-weight:400;

line-height:.92;

letter-spacing:3px;

text-shadow:
0 3px 20px rgba(0,0,0,.45);
}

.autor-portada{
position:absolute;

bottom:62px;

z-index:3;

color:
rgba(255,255,255,.88);

font-size:10px;

letter-spacing:5px;
}

.abrir-portada{
position:absolute;

bottom:25px;

z-index:4;

padding:8px 18px;

color:
rgba(255,255,255,.8);

background:transparent;

font-size:10px;

letter-spacing:4px;

border:
1px solid
rgba(255,255,255,.3);

border-radius:20px;
}

/* ============================================================
ROTACIÓN
============================================================ */

#rotateScreen{
position:fixed;
inset:0;
z-index:100;

display:none;

flex-direction:column;
align-items:center;
justify-content:center;

text-align:center;

background:#0b1535;
color:white;
}

.rotate-icon{
font-size:58px;
margin-bottom:20px;

animation:
girarTelefono 1.8s
ease-in-out infinite;
}

.rotate-title{
font-family:
'Cormorant Garamond',
serif;

font-size:30px;

letter-spacing:4px;

margin-bottom:12px;
}

.rotate-text{
font-size:13px;
opacity:.75;
max-width:280px;
}

@keyframes girarTelefono{

0%,100%{
transform:rotate(0deg);
}

50%{
transform:rotate(90deg);
}
}

@media (orientation:portrait){

#rotateScreen{
display:flex;
}

#startScreen{
display:none!important;
}

}

/* ============================================================
DECORACIÓN
============================================================ */

.flotante{
position:absolute;

pointer-events:none;

animation:
flotar linear infinite;

opacity:.8;
}

@keyframes flotar{

0%{
transform:
translateY(110vh)
rotate(0deg);

opacity:0;
}

10%{
opacity:.8;
}

90%{
opacity:.65;
}

100%{
transform:
translateY(-10vh)
rotate(25deg);

opacity:0;
}
}

/* ============================================================
JUEGO
============================================================ */

#gameContainer{
position:fixed;
inset:0;

display:none;

align-items:center;
justify-content:center;

background:#182e35;

overflow:hidden;
}

#canvasWrap{
position:relative;

width:100vw;
height:100vh;
}

#gameCanvas{
display:block;

width:100%;
height:100%;

background:#dcebcf;

image-rendering:auto;
}

/* ============================================================
HUD
============================================================ */

#hud{
  position:absolute;

  top:16px;
  left:16px;

  z-index:5;

  padding:10px 16px;

  font-family:'Quicksand',sans-serif;

  font-size:14px;
  font-weight:700;

  letter-spacing:.3px;

  color:#4a4035;

  background:
    linear-gradient(
      135deg,
      rgba(255,252,239,.97),
      rgba(246,239,218,.96)
    );

  border:1px solid
    rgba(119,139,91,.45);

  border-radius:14px;

  box-shadow:
    0 4px 0 rgba(62,79,58,.18),
    0 8px 20px rgba(30,40,25,.12);

  backdrop-filter:
    blur(4px);

  pointer-events:none;

  transition:
    transform .2s ease;
}
/* ============================================================
CONTROLES — AHORA VISIBLES PERO NO INVASIVOS
============================================================ */

#touchControls{
  position:absolute;

  inset:0;

  z-index:10;

  pointer-events:none;
}

.touch-btn{

  position:absolute;

  bottom:20px;

  width:62px;
  height:62px;

  display:flex;
  align-items:center;
  justify-content:center;

  pointer-events:auto;

  border-radius:50%;

  background:
    linear-gradient(
      145deg,
      rgba(255,253,242,.98),
      rgba(238,229,204,.97)
    );

  border:
    2px solid
    rgba(79,67,58,.58);

  color:#51473f;

  font-family:'Quicksand',sans-serif;

  font-size:32px;

  font-weight:700;

  box-shadow:
    0 5px 0 rgba(61,53,47,.32),
    0 8px 18px rgba(20,20,20,.16);

  user-select:none;

  -webkit-user-select:none;

  transition:
    transform .08s ease,
    box-shadow .08s ease;
}

.touch-btn:active{

  transform:
    translateY(4px)
    scale(.94);

  box-shadow:
    0 1px 0 rgba(61,53,47,.32),
    0 3px 8px rgba(20,20,20,.12);
}

#btnLeft{
  left:18px;
}

#btnRight{
  left:92px;
}

#btnJump{

  right:18px;

  width:70px;
  height:70px;

  font-size:36px;
}
/* ============================================================
   🌼 CONTROLES — MUNDO 2
============================================================ */

#touchControls.mundo2 .touch-btn{
  background:
    radial-gradient(
      circle at 35% 28%,
      #fff8c9,
      #f5c85b 55%,
      #d89428 100%
    );

  border:2px solid #9b641d;

  color:#fffdf2;

  box-shadow:
    0 5px 0 rgba(112,70,20,.38),
    0 8px 18px rgba(80,50,10,.20);

  text-shadow:
    0 1px 2px rgba(80,50,10,.35);
}

#touchControls.mundo2 .touch-btn:active{
  box-shadow:
    0 1px 0 rgba(112,70,20,.38),
    0 3px 8px rgba(80,50,10,.16);
}

/* ============================================================
   💜 CONTROLES — MUNDO 3
============================================================ */

#touchControls.mundo3 .touch-btn{
  background:
    radial-gradient(
      circle at 35% 28%,
      #f4eaff,
      #b99be8 52%,
      #7651aa 100%
    );

  border:2px solid #67418f;

  color:#fffaff;

  box-shadow:
    0 5px 0 rgba(65,38,100,.40),
    0 8px 18px rgba(45,25,75,.25);

  text-shadow:
    0 1px 3px rgba(55,30,85,.45);
}

#touchControls.mundo3 .touch-btn:active{
  box-shadow:
    0 1px 0 rgba(65,38,100,.40),
    0 3px 8px rgba(45,25,75,.18);
}

/* ============================================================
   🏎️ BOTONES F1 — MERCEDES / PETRONAS
============================================================ */

#touchControls.mundo4 .touch-btn{

  border-radius:6px;

  background:
    linear-gradient(
      145deg,
      #4b555a,
      #202629 55%,
      #101416
    );

  border:2px solid #9da7ad;

  color:#e8f4f3;

  box-shadow:
    0 5px 0 #090b0c,
    0 8px 18px rgba(0,0,0,.42),
    inset 0 0 8px rgba(255,255,255,.08);

  text-shadow:
    0 1px 3px #000;

}


#touchControls.mundo4 .touch-btn:active{

  transform:
    translateY(4px)
    scale(.94);

  box-shadow:
    0 1px 0 #090b0c,
    0 3px 8px rgba(0,0,0,.30);

}


/* 🩵 ACENTO PETRONAS */

#touchControls.mundo4 #btnJump{

  border-color:#00a19c;

  color:#9ffff9;

  box-shadow:
    0 5px 0 #090b0c,
    0 8px 18px rgba(0,0,0,.42),
    inset 0 0 10px rgba(0,220,210,.12);

}
/* ============================================================
   📚 CONTROLES — MUNDO 5
============================================================ */

#touchControls.mundo5 .touch-btn{
  border-radius:4px;

  background:
    linear-gradient(
      145deg,
      #e8d8b7,
      #c6aa78
    );

  border:2px solid #806546;

  color:#4b382b;

  box-shadow:
    0 5px 0 rgba(72,52,35,.42),
    0 8px 18px rgba(35,24,16,.25),
    inset 0 0 8px rgba(255,244,211,.28);

  text-shadow:
    0 1px 1px rgba(255,244,211,.45);
}

#touchControls.mundo5 .touch-btn:active{
  box-shadow:
    0 1px 0 rgba(72,52,35,.42),
    0 3px 8px rgba(35,24,16,.18);
}

#touchControls.mundo5 #btnJump{
  border-color:#68483f;
  color:#68483f;
}
/* ============================================================
VICTORIA
============================================================ */

#victoryScreen{

display:none;

background:

radial-gradient(
circle at 20% 20%,
rgba(255,255,255,.5),
transparent 40%
),

linear-gradient(
160deg,
#ffd6ec,
#cfe6ff 55%,
#fff1de
);
}

.victoria-titulo{

font-family:
'Press Start 2P',
monospace;

font-size:
clamp(16px,4vw,28px);

margin-bottom:10px;
}

.victoria-sub{

font-size:17px;

font-weight:600;

max-width:500px;

line-height:1.6;

margin:
14px 0 30px;
}

/* ============================================================
CONFETI
============================================================ */

#confetti{
position:fixed;

inset:0;

pointer-events:none;

z-index:45;
}

.confetti-piece{

position:absolute;

top:-10%;

animation:
caer linear forwards;
}

@keyframes caer{

0%{
transform:
translateY(0)
rotate(0deg);

opacity:1;
}

100%{
transform:
translateY(115vh)
rotate(360deg);

opacity:.2;
}
}

/* ============================================================
   CARTA
============================================================ */

#letterScreen{

  display:none;

  background:
    radial-gradient(
      circle at 20% 15%,
      rgba(255,255,255,.60),
      transparent 38%
    ),

    linear-gradient(
      145deg,
      #f7eadb,
      #f2dfd2 52%,
      #e8d8d0
    );
}


/* ============================================================
   TÍTULO
============================================================ */

.letter-title{

  font-family:
    'Press Start 2P',
    monospace;

  font-size:
    clamp(13px,3.2vw,20px);

  color:#5a4242;

  margin-bottom:34px;

  text-shadow:
    0 2px 0 rgba(255,255,255,.65);
}


/* ============================================================
   SOBRE
============================================================ */

#envelope{

  position:relative;

  width:220px;
  height:150px;

  cursor:pointer;

  filter:
    drop-shadow(
      0 12px 20px
      rgba(75,57,55,.28)
    );
}


/* cuerpo */

#envelope .cuerpo{

  position:absolute;

  inset:0;

  background:
    linear-gradient(
      160deg,
      #fffaf5,
      #f5e2d8
    );

  border:
    3px solid
    #9b6875;

  border-radius:8px;
}


/* solapa */

#envelope .solapa{

  position:absolute;

  top:-3px;
  left:-3px;
  right:-3px;

  height:80px;

  background:
    linear-gradient(
      160deg,
      #c87988,
      #9b5364
    );

  clip-path:
    polygon(
      0 0,
      100% 0,
      50% 90%
    );

  border-radius:
    8px 8px 0 0;

  transform-origin:top;

  transition:
    transform .7s
    cubic-bezier(.2,1.4,.4,1);

  z-index:3;
}


#envelope.abierto .solapa{

  transform:
    rotateX(180deg);
}


/* sello */

#envelope .corazon-sello{

  position:absolute;

  top:34px;
  left:50%;

  transform:
    translateX(-50%);

  font-size:26px;

  z-index:4;

  animation:
    latido 1.4s ease-in-out infinite;
}


#envelope.abierto .corazon-sello{

  display:none;
}


@keyframes latido{

  0%,100%{
    transform:
      translateX(-50%)
      scale(1);
  }

  50%{
    transform:
      translateX(-50%)
      scale(1.15);
  }
}


/* texto del sobre */

#envelope .toque{

  position:absolute;

  bottom:8px;

  width:100%;

  font-size:11px;

  text-align:center;

  color:#6d5558;

  letter-spacing:.3px;
}


/* ============================================================
   CARTA — ÚLTIMA PÁGINA
============================================================ */

#letterScreen{

  display:none;

  background:

    radial-gradient(
      ellipse at center,
      rgba(255,248,225,.72),
      transparent 58%
    ),

    linear-gradient(
      135deg,
      #c9b89d,
      #a9987e 48%,
      #877965
    );

  position:relative;
}


/* ============================================================
   TÍTULO
============================================================ */

.letter-title{

  font-family:
    'Press Start 2P',
    monospace;

  font-size:
    clamp(13px,3.2vw,20px);

  color:#3d3029;

  margin-bottom:34px;

  text-shadow:
    1px 1px 0 rgba(255,245,215,.55);
}

}


/* ============================================================
   CARTA — ÚLTIMO CAPÍTULO
============================================================ */

#letterScreen{

  position:fixed;
  inset:0;

  width:100vw;
  height:100vh;

  display:none;

  align-items:center;
  justify-content:center;

  overflow:hidden;

  box-sizing:border-box;

  z-index:5000;

  background:

    linear-gradient(
      rgba(20,16,14,.42),
      rgba(20,16,14,.72)
    ),

    url('biblioteca2.jpg')
    center center /
    cover
    no-repeat;
}


/* ============================================================
   AMBIENTE — PÁGINAS Y LIBROS AL FONDO
============================================================ */

#letterScreen::before{

  content:'';

  position:absolute;

  inset:-20%;

  background:

    repeating-linear-gradient(
      -8deg,
      transparent 0,
      transparent 82px,
      rgba(235,215,178,.045) 83px,
      rgba(235,215,178,.045) 85px,
      transparent 86px,
      transparent 170px
    );

  transform:rotate(-2deg);

  opacity:.8;

  pointer-events:none;
}


#letterScreen::after{

  content:'';

  position:absolute;

  left:0;
  right:0;
  bottom:0;

  height:34%;

  background:

    linear-gradient(
      180deg,
      transparent,
      rgba(15,11,9,.72)
    );

  pointer-events:none;
}


/* ============================================================
   DECORACIÓN ORIGINAL — FUERA
============================================================ */

#letterDecor{
  display:none!important;
}


/* ============================================================
   TÍTULO
============================================================ */

.letter-title{

  position:absolute;

  top:6vh;

  left:50%;

  transform:translateX(-50%);

  margin:0;

  width:90%;

  color:#e4d2ad;

  font-family:

'd',

].includes(e.key)    
){    
    
teclas.der=estado;

[

'w',    
'W',    
'ArrowUp'    
].includes(e.key)    
){    
    
teclas.salto=estado;    
    
e.preventDefault();    
    
}    
    
}

'keydown',    
e=>{    
manejarTecla(e,true);    
}    
);

e=>{    
manejarTecla(e,false);    
}    
);

teclas[prop]=true;

};    
    
    
const desactivar=e=>{    
    
teclas[prop]=false;    
    
e.preventDefault();    
    
};    
    
    
el.addEventListener(    
'touchstart',    
activar,    
{passive:false}    
);    
    
el.addEventListener(    
'touchend',    
desactivar,    
{passive:false}    
);    
    
el.addEventListener(    
'touchcancel',    
desactivar,    
{passive:false}    
);    
    
el.addEventListener(    
'mousedown',    
activar    
);    
    
el.addEventListener(    
'mouseup',    
desactivar    
);    
    
el.addEventListener(    
'mouseleave',    
desactivar    
);    
    
}

let audioCtx=null;    
    
    
function beep(    
freq,    
duracion,    
tipo='sine',    
vol=.15    
){    
    
try{    
    
if(!audioCtx){    
    
audioCtx=    
new(    
window.AudioContext||    
window.webkitAudioContext    
)();    
    
}    
    
const osc=    
audioCtx.createOscillator();    
    
const gain=    
audioCtx.createGain();    
    
osc.type=tipo;    
    
osc.frequency.value=freq;    
    
gain.gain.value=vol;    
    
osc.connect(gain);    
    
gain.connect(    
audioCtx.destination    
);    
    
osc.start();    
    
gain.gain.exponentialRampToValueAtTime(    
.001,    
audioCtx.currentTime+    
duracion    
);    
    
osc.stop(    
audioCtx.currentTime+    
duracion    
);    
    
}catch(e){}    
    
}

i++

player.w/2,

color:'#fff2c2'    
    
});

/* ============================================================    
ACTUALIZAR    
============================================================ */    
    
function actualizar(){    
    
tiempo++;    
    
    
/* movimiento */    
    
player.caminando=false;    
    
    
if(teclas.izq){    
    
player.vx=    
-CONFIG.VELOCIDAD_JUGADOR;    
    
player.mirando=-1;    
    
player.caminando=true;    
    
}    
    
else if(teclas.der){    
    
player.vx=    
CONFIG.VELOCIDAD_JUGADOR;    
    
player.mirando=1;    
    
player.caminando=true;    
    
}    
    
else{    
    
player.vx=0;    
    
}    
    
    
if(player.caminando){    
    
player.cicloAnim+=.28;    
    
}    
    
    
/* salto */    
    
if(    
teclas.salto&&    
player.onGround    
){    
    
player.vy=    
-CONFIG.FUERZA_SALTO;    
    
player.onGround=false;    
  
    
}    
    
    
/* gravedad */    
    
player.vy+=    
CONFIG.GRAVEDAD;    
    
player.vy=    
Math.min(    
player.vy,    
22    
);    
    
    
/* ============================================================    
X    
============================================================ */    
    
player.x+=    
player.vx;    
    
    
plataformasAereas.forEach(    
p=>{    
    
if(    
rectChocan(    
player,    
p    
)    
){    
    
if(player.vx>0){    
    
player.x=    
p.x-player.w;    
    
}    
    
else if(player.vx<0){    
    
player.x=    
p.x+p.w;    
    
}    
    
}    
    
}    
);    
    
    
player.x=    
Math.max(    
0,    
Math.min(    
WORLD_WIDTH-player.w,    
player.x    
)    
);    
    
    
/* ============================================================    
Y    
============================================================ */    
    
const oldY=    
player.y;    
    
player.onGround=false;    
    
player.y+=    
player.vy;    
    
    
/* suelo */    
    
for(    
const suelo of plataformas.filter(    
p=>p.color==='suelo'    
)    
){    
    
if(    
rectChocan(    
player,    
suelo    
)&&    
player.vy>=0    
){    
    
const bordeAnterior=    
oldY+    
player.h;    
    
if(    
bordeAnterior<=    
suelo.y+3    
){    
    
player.y=    
suelo.y-player.h;    
    
player.vy=0;    
    
player.onGround=true;    
    
break;    
    
}    
    
}    
    
}    
    
    
/* plataformas aéreas */    
    
for(    
const p of plataformasAereas    
){    
    
if(    
!rectChocan(    
player,    
p    
)    
)    
continue;    
    
    
if(    
player.vy>=0&&    
oldY+    
player.h<=    
p.y+5    
){    
    
player.y=    
p.y-player.h;    
    
player.vy=0;    
    
player.onGround=true;    
    
}    
    
else if(    
player.vy<0&&    
oldY>=    
p.y+p.h-4    
){    
    
player.y=    
p.y+p.h;    
    
player.vy=0;    
    
}    
    
}    
    
    
/* ============================================================    
CHECKPOINT    
============================================================ */    
    
checkpoints.forEach(    
c=>{    
    
if(    
player.x>=c.x    
){    
    
player.checkpointX=    
c.x;    
    
}    
    
}    
);    
    
    
/* ============================================================    
OBSTÁCULOS    
============================================================ */    
    
for(const o of obstaculos){    
    
    if(!rectChocan(player,o))    
        continue;    
    
    /*    
    LOS OBSTÁCULOS NO MATAN A LOUI.    
    
    Si Loui cae encima de una piedra/flor,    
    puede apoyarse sobre ella.    
    
    Si intenta atravesarla lateralmente,    
    simplemente se detiene frente al obstáculo.    
    */    
    
    const estabaArriba =    
        oldY + player.h <= o.y + 5;    
    
    if(    
        estabaArriba &&    
        player.vy >= 0    
    ){    
    
        player.y =    
            o.y - player.h;    
    
        player.vy = 0;    
    
        player.onGround = true;    
    
    }    
    else{    
    
        /*    
        Colisión lateral:    
        no pierde, no reinicia y no vuelve    
        al checkpoint.    
        */    
    
        if(player.vx > 0){    
    
            player.x =    
                o.x - player.w;    
    
        }    
        else if(player.vx < 0){    
    
            player.x =    
                o.x + o.w;    
    
        }    
    
        player.vx = 0;    
    
    }

monedas.forEach(

player.x+    
player.w/2-    
m.x;

player.y+

){

for(

      Math.random()*2

  });

}

}
}
);

function dibujarPolenCempasuchil(){

  if(mundoActual!==2)
    return;

  ctx.save();

  for(let i=0;i<32;i++){

    const x=
      ((i*137+
        tiempo*.18+
        Math.sin(i*2.7)*40)
        % (W+80))-40;

    const y=
      ((i*83+
        Math.sin(tiempo*.012+i)*28)
        % (H+40))-20;

    const tamaño=
      1.2+
      Math.sin(i*1.8)*.45;

    const alpha=
      .18+
      Math.sin(tiempo*.025+i)*.12;

    ctx.globalAlpha=
      Math.max(.06,alpha);

    ctx.fillStyle=
      i%3===0
        ? '#ffd66b'
        : '#f5a623';

    ctx.beginPath();

    ctx.arc(
      x,
      y,
      tamaño,
      0,
      Math.PI*2
    );

    ctx.fill();
  }

  ctx.restore();
}

      'rgba(255,215,107,0)'
    );

    ctx.fillStyle=brillo;

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      tam*3,
      0,
      Math.PI*2
    );

    ctx.fill();


    /* centro luminoso */

    ctx.fillStyle=
      p.color || '#ffd76b';

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      tam,
      0,
      Math.PI*2
    );

    ctx.fill();


    /* destello */

    if(tam>3){

      ctx.strokeStyle=
        '#fff8d6';

      ctx.lineWidth=1;

      ctx.beginPath();

      ctx.moveTo(
        p.x-tam*2,
        p.y
      );

      ctx.lineTo(
        p.x+tam*2,
        p.y
      );

      ctx.moveTo(
        p.x,
        p.y-tam*2
      );

      ctx.lineTo(
        p.x,
        p.y+tam*2
      );

      ctx.stroke();

    }

    ctx.restore();

  }
);

ctx.globalAlpha=1;
    
    
/* meta */    
    
dibujarMeta();    
    
    
/* gato */    
    
dibujarPersonaje();    
    
    
ctx.restore();    
    
    
ctx.restore();    
    
}

/* ============================================================
   🏎️ BARRERA F1 — PADDOCK NOCTURNO MERCEDES
============================================================ */

function dibujarBarreraF1(x,y,w=70){

  if(mundoActual!==4)
    return;

  ctx.save();


  /* SOPORTES */

  ctx.fillStyle='#111519';

  ctx.fillRect(
    x+8,
    y,
    5,
    25
  );

  ctx.fillRect(
    x+w-13,
    y,
    5,
    25
  );


  /* ============================================================
     🩶 BARRERA
  ============================================================ */

  const barrera=
    ctx.createLinearGradient(
      x,
      y,
      x,
      y+18
    );

  barrera.addColorStop(
    0,
    '#454e53'
  );

  barrera.addColorStop(
    .45,
    '#252c30'
  );

  barrera.addColorStop(
    1,
    '#101416'
  );

  ctx.fillStyle=barrera;

  ctx.beginPath();

  ctx.roundRect(
    x,
    y,
    w,
    18,
    3
  );

  ctx.fill();


  /* ============================================================
     🩵 FRANJAS PETRONAS
  ============================================================ */

  ctx.save();

  ctx.beginPath();

  ctx.roundRect(
    x,
    y,
    w,
    18,
    3
  );

  ctx.clip();

  ctx.fillStyle='#00a19c';

  for(
    let i=-20;
    i<w+20;
    i+=28
  ){

    ctx.save();

    ctx.translate(
      x+i,
      y
    );

    ctx.rotate(
      -.55
    );

    ctx.fillRect(
      0,
      -10,
      8,
      40
    );

    ctx.restore();

  }

  ctx.restore();


  /* ============================================================
     BORDE SUPERIOR
  ============================================================ */

  ctx.fillStyle='#c9d0d4';

  ctx.fillRect(
    x,
    y,
    w,
    3
  );


  /* LÍNEA LED */

  ctx.fillStyle='#00d8d0';

  ctx.fillRect(
    x+3,
    y+15,
    w-6,
    2
  );


  /* ============================================================
     BASES
  ============================================================ */

  ctx.fillStyle='#0b0e10';

  ctx.fillRect(
    x+3,
    y+23,
    15,
    4
  );

  ctx.fillRect(
    x+w-18,
    y+23,
    15,
    4
  );


  /* PEQUEÑOS REFLEJOS */

  ctx.fillStyle=
    'rgba(120,255,245,.35)';

  ctx.fillRect(
    x+12,
    y+4,
    w*.28,
    1
  );


  ctx.restore();
}

    3,
    -35,
    5,
    0
  );

  /* REFLEJO TURQUESA EN EL TRONCO */

  ctx.strokeStyle='rgba(0,161,156,.28)';

  ctx.lineWidth=1.5;

  ctx.beginPath();

  ctx.moveTo(
    2,
    -5
  );

  ctx.quadraticCurveTo(
    2,
    -38,
    4,

  );

  ctx.stroke();


  /* ============================================================
     🌿 HOJAS

  const hojas=[
    [-30,-75,-.65],

    [0,-94,0],
    [18,-88,.3],

  ];

  hojas.forEach(

      ctx.save();

      ctx.translate(
        2,

      ctx.rotate(rot);

      );

      ctx.quadraticCurveTo(

  ctx.restore();

      );

    ctx.fillStyle=

    ctx.arc(

  );

function dibujarHierba(    
x,    
y,    
variante    
){    
    
const h=    
7+    
variante*2;    
    
    
ctx.save();    
    
ctx.strokeStyle=    
variante===1    
?'#668b50'    
:'#76965a';

ctx.lineCap='round';    
    
ctx.beginPath();    
    
ctx.moveTo(    
x,    
y+3    
);    
    
ctx.lineTo(    
x-3,    
y-h    
);    
    
ctx.moveTo(    
x,    
y+3    
);    
    
ctx.lineTo(    
x+2,    
y-h-2    
);    
    
ctx.moveTo(    
x+2,    
y+3    
);    
    
ctx.lineTo(    
x+7,    
y-h+1    
);    
    
ctx.stroke();    
    
ctx.restore();    
    
}

  ctx.roundRect(
    p.x,
    y+2,
    p.w,
    p.h,
    4
  );

  ctx.fill();


  /* 📕 LOMO / BORDE INFERIOR */

  ctx.fillStyle=
    'rgba(82,59,45,.55)';

  ctx.fillRect(
    p.x+3,
    y+p.h-4,
    p.w-6,
    4
  );


  /* 📄 LÍNEAS DE LAS PÁGINAS */

  ctx.strokeStyle=
    'rgba(105,82,62,.32)';

  ctx.lineWidth=1;

  for(
    let linea=0;
    linea<3;
    linea++
  ){

    ctx.beginPath();

    ctx.moveTo(
      p.x+8,
      y+7+linea*4
    );

    ctx.lineTo(
      p.x+p.w-8,
      y+7+linea*4
    );

    ctx.stroke();

  }


  /* 📖 BORDE SUPERIOR */

  ctx.strokeStyle=
    'rgba(255,248,226,.85)';

  ctx.lineWidth=1.5;

  ctx.beginPath();

  ctx.moveTo(
    p.x+5,
    y+3
  );

  ctx.lineTo(
    p.x+p.w-5,
    y+3
  );

  ctx.stroke();


  /* ✒️ PEQUEÑOS DETALLES DE TEXTO */

  ctx.strokeStyle=
    'rgba(88,68,55,.25)';

  ctx.lineWidth=1;

  for(
    let x=p.x+18;
    x<p.x+p.w-12;
    x+=27
  ){

    ctx.beginPath();

    ctx.moveTo(
      x,
      y+15
    );

    ctx.lineTo(
      x+12,
      y+15
    );

    ctx.stroke();

  }


  /* 📚 ALGUNAS PLATAFORMAS PARECEN LIBROS */

  if(i%3===0){

    ctx.fillStyle=
      'rgba(105,72,64,.70)';

    ctx.fillRect(
      p.x+7,
      y+p.h-2,
      p.w-14,
      2
    );

  }


  /* ✨ PEQUEÑO BRILLO DE PAPEL */

  if(i%4===1){

    ctx.fillStyle=
      'rgba(255,248,225,.75)';

    ctx.beginPath();

    ctx.arc(
      p.x+p.w-12,
      y+7,
      1.5,
      0,
      Math.PI*2
    );

    ctx.fill();

  }

  }else if(mundoActual===2){

    /* ==========================================================
       🌼 MUNDO 2 — PLATAFORMA DE ALTAR
    ========================================================== */

    /* SOMBRA */

    ctx.fillStyle=
      'rgba(35,18,12,.38)';

    ctx.beginPath();

    ctx.roundRect(
      p.x+6,
      y+8,
      p.w,
      p.h+8,
      6
    );

    ctx.fill();


    /* 🧱 PIEDRA */

    const piedra=
      ctx.createLinearGradient(
        0,
        y,
        0,
        y+p.h+8
      );

    piedra.addColorStop(
      0,
      '#8b6b58'
    );

    piedra.addColorStop(
      .45,
      '#6d5145'
    );

    piedra.addColorStop(
      1,
      '#493831'
    );

    ctx.fillStyle=piedra;

    ctx.beginPath();

    ctx.roundRect(
      p.x,
      y+3,
      p.w,
      p.h,
      5
    );

    ctx.fill();


    /* BORDE DE PIEDRA */

    ctx.strokeStyle=
      '#b89472';

    ctx.lineWidth=2;

    ctx.stroke();


    /* 🟠 BORDE DE CEMPASÚCHIL */

    ctx.fillStyle='#e88916';

    ctx.fillRect(
      p.x+4,
      y,
      p.w-8,
      5
    );


    /* 🌼 PEQUEÑAS FLORES */

    for(
      let x=p.x+16;
      x<p.x+p.w-10;
      x+=32
    ){

      ctx.fillStyle='#f4a51c';

      for(
        let j=0;
        j<5;
        j++
      ){

        const a=
          j*Math.PI*2/5;

        ctx.beginPath();

        ctx.arc(
          x+
          Math.cos(a)*3,
          y+2+
          Math.sin(a)*3,
          2,
          0,
          Math.PI*2
        );

        ctx.fill();

      }

      ctx.fillStyle='#8b4a18';

      ctx.beginPath();

      ctx.arc(
        x,
        y+2,
        1.5,
        0,
        Math.PI*2
      );

      ctx.fill();

    }


    /* 🕯️ VELADORAS EN ALGUNAS PLATAFORMAS */

    if(i%3===1){

      const velaX=
        p.x+p.w*.72;

      /* cuerpo */

      ctx.fillStyle='#f5dfb0';

      ctx.fillRect(
        velaX-3,
        y-13,
        6,
        13
      );

      /* llama */

      ctx.fillStyle='#ffb52b';

      ctx.beginPath();

      ctx.arc(
        velaX,
        y-16,
        3,
        0,
        Math.PI*2
      );

      ctx.fill();

    }


    /* ✨ DETALLES DE PIEDRA */

    ctx.strokeStyle=
      'rgba(235,202,168,.22)';

    ctx.lineWidth=1;

    for(
      let x=p.x+12;
      x<p.x+p.w-8;
      x+=30
    ){

      ctx.beginPath();

      ctx.moveTo(
        x,
        y+15
      );

      ctx.lineTo(
        x+7,
        y+18
      );

      ctx.lineTo(
        x+3,
        y+23
      );

      ctx.stroke();

    }
    ctx.globalAlpha=1;


  }else{

    /* ==========================================================
       MUNDO 1 — PLATAFORMA ORIGINAL
    ========================================================== */

    ctx.fillStyle=
      'rgba(25,35,27,.30)';

    ctx.beginPath();

    ctx.roundRect(
      p.x+5,
      y+9,
      p.w,
      p.h+7,
      7
    );

    ctx.fill();


    const tierra=
      ctx.createLinearGradient(
        0,
        y+5,
        0,
        y+p.h+25
      );

    tierra.addColorStop(
      0,
      '#718c55'
    );

    tierra.addColorStop(
      .18,
      '#65794d'
    );

    tierra.addColorStop(
      .55,
      '#665441'
    );

    tierra.addColorStop(
      1,
      '#423b35'
    );

    ctx.fillStyle=tierra;

    ctx.beginPath();

    ctx.roundRect(
      p.x,
      y+2,
      p.w,
      p.h,
      6
    );

    ctx.fill();


    const cesped=
      ctx.createLinearGradient(
        0,
        y,
        0,
        y+10
      );

    cesped.addColorStop(
      0,
      '#a4c878'
    );

    cesped.addColorStop(
      .5,
      '#82a960'
    );

    cesped.addColorStop(
      1,
      '#62864e'
    );

    ctx.fillStyle=cesped;

    ctx.beginPath();

    ctx.roundRect(
      p.x,
      y,
      p.w,
      9,
      5
    );

    ctx.fill();


    ctx.strokeStyle='#b0d080';
    ctx.lineWidth=1.5;

    for(
      let x=p.x+6;
      x<p.x+p.w-5;
      x+=12
    ){

      const h=
        3+
        Math.abs(
          Math.sin(x*.27)
        )*3;

      ctx.beginPath();

      ctx.moveTo(
        x,
        y+5
      );

      ctx.lineTo(
        x-2,
        y-h
      );

      ctx.stroke();

    }

  }


  ctx.restore();

}

/* ============================================================
   OBSTÁCULO
============================================================ */

function dibujarObstaculo(o){

  const centroX=o.x+o.w/2;
  const baseY=o.y+o.h;

  ctx.save();

  /* ============================================================
     🌼💀 MUNDO 2 — OBSTÁCULOS DE DÍA DE MUERTOS
  ============================================================ */

  if(mundoActual===2){

    /* 🪨 CALAVERITA DE PIEDRA */

    if(o.tipo==='rocas'){

      /* sombra */

      ctx.fillStyle=
        'rgba(35,18,12,.40)';

      ctx.beginPath();

      ctx.ellipse(
        centroX,
        baseY+4,
        o.w*.65,
        5,
        0,
        0,
        Math.PI*2
      );

      ctx.fill();


      /* piedra */

      const piedra=
        ctx.createLinearGradient(
          o.x,
          o.y,
          o.x,
          baseY
        );

      piedra.addColorStop(
        0,
        '#d1b99a'
      );

      piedra.addColorStop(
        .55,
        '#9b8068'
      );

      piedra.addColorStop(
        1,
        '#5e493b'
      );

      ctx.fillStyle=piedra;

      ctx.beginPath();

      ctx.arc(
        centroX,
        o.y+o.h*.48,
        o.w*.38,
        Math.PI,
        Math.PI*2
      );

      ctx.lineTo(
        centroX+o.w*.30,
        baseY
      );

      ctx.lineTo(
        centroX-o.w*.30,
        baseY
      );

      ctx.closePath();

      ctx.fill();


      /* 🖤 OJOS */

      ctx.fillStyle='#34251e';

      ctx.beginPath();

      ctx.ellipse(
        centroX-o.w*.15,
        o.y+o.h*.42,
        4,
        5,
        -.25,
        0,
        Math.PI*2
      );

      ctx.fill();

      ctx.beginPath();

      ctx.ellipse(
        centroX+o.w*.15,
        o.y+o.h*.42,
        4,
        5,
        .25,
        0,
        Math.PI*2
      );

      ctx.fill();


      /* 🖤 NARIZ */

      ctx.beginPath();

      ctx.moveTo(
        centroX,
        o.y+o.h*.57
      );

      ctx.lineTo(
        centroX-3,
        o.y+o.h*.63
      );

      ctx.lineTo(
        centroX+3,
        o.y+o.h*.63
      );

      ctx.closePath();

      ctx.fill();


      /* 🦷 BOCA */

      ctx.strokeStyle='#34251e';

      ctx.lineWidth=1.5;

      ctx.beginPath();

      ctx.moveTo(
        centroX-o.w*.18,
        o.y+o.h*.73
      );

      ctx.quadraticCurveTo(
        centroX,
        o.y+o.h*.82,
        centroX+o.w*.18,
        o.y+o.h*.73
      );

      ctx.stroke();


      /* ✨ DETALLE DORADO */

      ctx.strokeStyle='#e8a52b';

      ctx.lineWidth=1.2;

      ctx.beginPath();

      ctx.arc(
        centroX,
        o.y+o.h*.48,
        o.w*.44,
        Math.PI+.35,
        Math.PI*2-.35
      );

      ctx.stroke();


      ctx.restore();

      return;

    }


    /* 🕯️ VELADORA */

    ctx.fillStyle=
      'rgba(35,18,12,.35)';

    ctx.beginPath();

    ctx.ellipse(
      centroX,
      baseY+4,
      o.w*.55,
      4,
      0,
      0,
      Math.PI*2
    );

    ctx.fill();


    /* base */

    ctx.fillStyle='#70432d';

    ctx.beginPath();

    ctx.roundRect(
      centroX-o.w*.32,
      o.y+o.h*.55,
      o.w*.64,
      o.h*.45,
      3
    );

    ctx.fill();


    /* cera */

    ctx.fillStyle='#f1dfb4';

    ctx.beginPath();

    ctx.roundRect(
      centroX-o.w*.22,
      o.y+o.h*.05,
      o.w*.44,
      o.h*.62,
      4
    );

    ctx.fill();


    /* detalles de cera */

    ctx.fillStyle='#e0c58f';

    ctx.beginPath();

    ctx.ellipse(
      centroX,
      o.y+o.h*.08,
      o.w*.22,
      3,
      0,
      0,
      Math.PI*2
    );

    ctx.fill();


    /* 🕯️ LLAMA */

    ctx.fillStyle='#e88919';

    ctx.beginPath();

    ctx.ellipse(
      centroX,
      o.y-3,
      5,
      8,
      0,
      0,
      Math.PI*2
    );

    ctx.fill();


    ctx.fillStyle='#ffe9a3';

    ctx.beginPath();

    ctx.ellipse(
      centroX,
      o.y-4,
      2,
      4,
      0,
      0,
      Math.PI*2
    );

    ctx.fill();


    /* 🌼 PEQUEÑA FLOR */

    ctx.fillStyle='#f2a51c';

    for(
      let i=0;
      i<5;
      i++
    ){

      const a=
        i*Math.PI*2/5;

      ctx.beginPath();

      ctx.arc(
        centroX+
        Math.cos(a)*5,
        o.y+o.h*.28+
        Math.sin(a)*5,
        2.5,
        0,
        Math.PI*2
      );

      ctx.fill();

    }

    ctx.fillStyle='#8b4a18';

    ctx.beginPath();

    ctx.arc(
      centroX,
      o.y+o.h*.28,
      2,
      0,
      Math.PI*2
    );

    ctx.fill();


    ctx.restore();

    return;

  }
  
/* ============================================================
   🏎️ MUNDO 4 — OBSTÁCULOS F1
============================================================ */

if(mundoActual===4){

  if(o.tipo==='neumatico'){

    dibujarNeumaticoF1(
      centroX,
      o.y+o.h/2
    );

    return;
  }

  if(o.tipo==='barrera'){

    dibujarBarreraF1(

    );

    ctx.restore();

    return;
  }

}

/* ============================================================
   📚 MUNDO 5 — ENTRE PÁGINAS
============================================================ */

if(mundoActual===5){

  /* ==========================================================
     📚 LIBRO APILADO
  ========================================================== */

  if(o.tipo==='libro'){

    /* sombra */

    ctx.fillStyle=
      'rgba(20,12,8,.35)';

    ctx.ellipse(

      baseY+4,
      o.w*.60,

      0,

    );

    /* libros */

    const libros=[

      '#4d5968'

    for(let i=0;i<3;i++){

      ctx.fillStyle=

      ctx.beginPath();

      ctx.roundRect(
        o.x+2,
        o.y+o.h-(i+1)*17,
        o.w-4,
        15,
        2
      );

      ctx.fill();

    }


    /* páginas */

    ctx.fillStyle='#e7d8bc';

    ctx.fillRect(
      o.x+8,
      o.y+o.h-14,
      o.w-16,
      4
    );


    /* lomo */

    ctx.strokeStyle=
      'rgba(255,235,200,.35)';

    ctx.lineWidth=1;

    ctx.beginPath();

    ctx.moveTo(
      o.x+10,
      o.y+o.h-42
    );

    ctx.lineTo(
      o.x+10,
      o.y+o.h-27
    );

    ctx.stroke();


    ctx.restore();

    return;
  }


  /* ==========================================================
     📖 LIBRO ABIERTO
  ========================================================== */

  if(o.tipo==='libroAbierto'){

    /* sombra */

    ctx.fillStyle=
      'rgba(20,12,8,.35)';

    ctx.beginPath();

    ctx.ellipse(
      centroX,
      baseY+4,
      o.w*.65,
      4,
      0,
      0,
      Math.PI*2
    );

    ctx.fill();


    /* páginas */

    ctx.fillStyle='#eadfc9';

    ctx.beginPath();

    ctx.moveTo(
      centroX,
      o.y+8
    );

    ctx.quadraticCurveTo(
      o.x+o.w*.25,
      o.y,
      o.x+3,
      o.y+10
    );

    ctx.lineTo(
      o.x+7,
      baseY
    );

    ctx.lineTo(
      centroX,
      o.y+o.h-8
    );

    ctx.closePath();

    ctx.fill();


    ctx.beginPath();

    ctx.moveTo(
      centroX,
      o.y+8
    );

    ctx.quadraticCurveTo(
      o.x+o.w*.75,
      o.y,
      o.x+o.w-3,
      o.y+10
    );

    ctx.lineTo(
      o.x+o.w-7,
      baseY
    );

    ctx.lineTo(
      centroX,
      o.y+o.h-8
    );

    ctx.closePath();

    ctx.fill();


    /* líneas */

    ctx.strokeStyle=
      'rgba(92,70,52,.28)';

    ctx.lineWidth=1;

    for(let i=0;i<3;i++){

      const y=
        o.y+20+i*9;

      ctx.beginPath();

      ctx.moveTo(
        o.x+13,
        y
      );

      ctx.lineTo(
        centroX-7,
        y-2
      );

      ctx.moveTo(
        centroX+7,
        y-2
      );

      ctx.lineTo(
        o.x+o.w-13,
        y
      );

      ctx.stroke();

    }


    ctx.restore();

    return;
  }


  /* ==========================================================
     🪑 SILLA
  ========================================================== */

  if(o.tipo==='silla'){

    ctx.strokeStyle='#593d2d';
    ctx.lineWidth=6;
    ctx.lineCap='round';

    /* respaldo */

    ctx.beginPath();

    ctx.moveTo(
      o.x+10,
      o.y+5
    );

    ctx.lineTo(
      o.x+10,
      o.y+32
    );

    ctx.lineTo(
      o.x+o.w-8,
      o.y+32
    );

    ctx.stroke();


    /* asiento */

    ctx.beginPath();

    ctx.moveTo(
      o.x+8,
      o.y+32
    );

    ctx.lineTo(
      o.x+o.w-5,
      o.y+32
    );

    ctx.stroke();


    /* patas */

    ctx.lineWidth=4;

    ctx.beginPath();

    ctx.moveTo(
      o.x+13,
      o.y+34
    );

    ctx.lineTo(
      o.x+8,
      baseY
    );

    ctx.moveTo(
      o.x+o.w-10,
      o.y+34
    );

    ctx.lineTo(
      o.x+o.w-5,
      baseY
    );

    ctx.stroke();


    ctx.restore();

    return;
  }


  /* ==========================================================
     📝 HOJAS
  ========================================================== */

  if(o.tipo==='hojas'){

    ctx.fillStyle=
      'rgba(20,12,8,.28)';

    ctx.beginPath();

    ctx.ellipse(
      centroX,
      baseY+3,
      o.w*.6,
      4,
      0,
      0,
      Math.PI*2
    );

    ctx.fill();


    ctx.fillStyle='#eee4cf';

    ctx.save();

    ctx.translate(
      centroX,
      o.y+o.h/2
    );

    ctx.rotate(-.08);

    ctx.fillRect(
      -o.w*.42,
      -o.h*.35,
      o.w*.72,
      o.h*.65
    );

    ctx.restore();


    ctx.fillStyle='#d8c9af';

    ctx.fillRect(
      o.x+8,
      o.y+o.h*.45,
      o.w*.55,
      2
    );

    ctx.fillRect(
      o.x+8,
      o.y+o.h*.60,
      o.w*.42,
      2
    );


    ctx.restore();

    return;
  }


  /* ==========================================================
     🗄️ ARCHIVADOR
  ========================================================== */

  if(o.tipo==='archivador'){

    /* sombra */

    ctx.fillStyle=
      'rgba(20,12,8,.38)';

    ctx.beginPath();

    ctx.ellipse(
      centroX,
      baseY+4,
      o.w*.60,
      4,
      0,
      0,
      Math.PI*2
    );

    ctx.fill();


    /* cuerpo */

    const metal=
      ctx.createLinearGradient(
        o.x,
        o.y,
        o.x+o.w,
        o.y
      );

    metal.addColorStop(
      0,
      '#4d5155'
    );

    metal.addColorStop(
      .5,
      '#77736d'
    );

    metal.addColorStop(
      1,
      '#3c3e40'
    );

    ctx.fillStyle=metal;

    ctx.beginPath();

    ctx.roundRect(
      o.x,
      o.y,
      o.w,
      o.h,
      3
    );

    ctx.fill();


    /* cajones */

    ctx.strokeStyle=
      'rgba(30,30,30,.5)';

    ctx.lineWidth=1;

    for(let i=1;i<3;i++){

      const y=
        o.y+
        i*(o.h/3);

      ctx.beginPath();

      ctx.moveTo(
        o.x+4,
        y
      );

      ctx.lineTo(
        o.x+o.w-4,
        y
      );

      ctx.stroke();

    }


    /* tiradores */

    ctx.fillStyle='#d0b98e';

    for(let i=0;i<3;i++){

      ctx.fillRect(
        centroX-7,
        o.y+12+i*24,
        14,
        3
      );

    }


    ctx.restore();

    return;
  }

}

    o.h,
    3
  );

  if(

    portada.naturalWidth>0

    ctx.save();

    ctx.beginPath();

    ctx.roundRect(
      o.x,
      o.y,
      o.w,
      o.h,
      3

    ctx.clip();

    ctx.drawImage(
      portada,
      o.x,
      o.y,
      o.w,
      o.h
    );

  }else{

        o.y,

    );

      '#29232f'

      o.y,

  /* ========================================================

  ctx.strokeStyle=

    baseY+3,
    o.w*.7,
    18,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.globalAlpha=1;


  ctx.restore();

  return;
}

  /* ============================================================
     SOMBRA
  ============================================================ */

  ctx.fillStyle=

  ctx.ellipse(

    baseY+3,
    o.w*.75,

    0,
    Math.PI*2

  ctx.fill();


  /* ============================================================
     ROCAS
  ============================================================ */

  if(o.tipo==='rocas'){

      ctx.createLinearGradient(

        o.y,

        '#a18b70'
      );

      roca.addColorStop(
        .72,
        '#796650'
      );

      roca.addColorStop(
        1,
        '#514333'
      );

    }else{

        0,
        '#c8c3ba'
      );

      roca.addColorStop(
        .38,
        '#9a958d'
      );

      roca.addColorStop(
        .72,
        '#77736c'
      );

      roca.addColorStop(
        1,
        '#514f4b'
      );

    }


    ctx.fillStyle=roca;

    ctx.beginPath();

    ctx.moveTo(

    ctx.lineTo(

      o.y+12

    ctx.quadraticCurveTo(

    ctx.beginPath();

    ctx.ellipse(

    /* segunda piedra */

      mundoActual===2

    ctx.beginPath();

    ctx.ellipse(

      o.y+o.h*.68,
      o.w*.23,
      o.h*.25,
      .12,
      0,
      Math.PI*2
    );

    ctx.fill();


    /* grietas */

      mundoActual===2
        ? 'rgba(58,42,28,.52)'

    ctx.lineWidth=1.3;
    ctx.lineCap='round';

    ctx.beginPath();

    ctx.moveTo(
      o.x+o.w*.57,
      o.y+9
    );

    ctx.lineTo(
      o.x+o.w*.51,
      o.y+16
    );

    ctx.lineTo(
      o.x+o.w*.61,
      o.y+20
    );

    ctx.stroke();


    ctx.beginPath();

    ctx.moveTo(
      o.x+o.w*.26,
      o.y+15
    );

    ctx.lineTo(
      o.x+o.w*.32,
      o.y+20
    );

    ctx.stroke();


    /* piedritas */

    ctx.fillStyle=
      mundoActual===2

    );

    ctx.moveTo(

      baseY

    /* ==========================================================
       CEMPASÚCHIL

    if(mundoActual===2){

        [8,-5],
        [-5,-11],
        [5,-11],

      for(

          6,
          8,
          dx*.035,
          0,
          Math.PI*2
        );

        ctx.fill();

      }


      /* centro */

      const centro=
        ctx.createRadialGradient(
          centroX-1,
          o.y-3,
          1,
          centroX,
          o.y-3,
          7
        );

      centro.addColorStop(
        0,
        '#ffe99a'
      );

      centro.addColorStop(
        .5,
        '#c9821b'
      );

      centro.addColorStop(
        1,
        '#71400f'
      );

      ctx.fillStyle=centro;

      ctx.beginPath();

      ctx.arc(
        centroX,
        o.y-3,
        6,
        0,
        Math.PI*2
      );

      ctx.fill();


      ctx.fillStyle=
        'rgba(255,244,177,.70)';

      ctx.beginPath();

      ctx.arc(
        centroX-2,
        o.y-5,
        1.5,
        0,
        Math.PI*2
      );

      ctx.fill();


    }else{

      /* ========================================================
         FLOR ORIGINAL DEL MUNDO 1
      ======================================================== */

      const petalos=[
        [-7,-5],
        [7,-5],
        [-4,-11],
        [4,-11],

      ];

          '#936db8'

        ctx.beginPath();

          centroX+dx,
          o.y+dy,

          9,
          dx*.035,

        0,
        '#fff7bf'
      );

        .55,
        '#e8bd55'
      );

      centro.addColorStop(
        1,
        '#a97831'
      );

      ctx.fillStyle=centro;

      ctx.beginPath();

      ctx.arc(
        centroX,
        o.y-3,
        6,
        0,
        Math.PI*2
      );

      ctx.fill();


      /* brillo */

      ctx.fillStyle=
        'rgba(255,255,255,.65)';

      ctx.beginPath();

      ctx.arc(
        centroX-2,
        o.y-5,
        1.5,
        0,
        Math.PI*2
      );

      ctx.fill();

    }

  }


  ctx.restore();

}

let ultimoRender=0;
const esPantallaMovil = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
const intervaloRenderMovil=1000/45;

function loop(ahora){

if(!juegoActivo) return;

actualizar();

/* La lógica sigue a 60 Hz; en móviles limitamos el render gráfico a ~45 FPS. */
if(!esPantallaMovil || ahora-ultimoRender>=intervaloRenderMovil){
  ultimoRender=ahora;
  dibujar();
}

requestAnimationFrame(loop);

}

          musicaBTS.volume=.45;

          musicaBTS.currentTime=0;

          musicaBTS
            .play()
            .catch(
              ()=>{
                console.log(
                  'El navegador bloqueó la reproducción automática.'
                );
              }
            );

        }


else if(mundoActual===4){

  if(musicaPrincipal){
    musicaPrincipal.pause();
    musicaPrincipal.currentTime=0;
  }

  musicaCempasuchil.pause();
  musicaCempasuchil.currentTime=0;

  musicaBTS.pause();
  musicaBTS.currentTime=0;

  musicaF1.pause();
  musicaF1.currentTime=0;

  musicaF1.volume=.45;

  musicaF1
    .play()
    .catch(
      ()=>{
        console.log(
          'El navegador bloqueó la reproducción automática.'
        );
      }
    );

}

else if(mundoActual===5){

  if(musicaPrincipal){
    musicaPrincipal.pause();
    musicaPrincipal.currentTime=25;
  }

  musicaCempasuchil.pause();
  musicaCempasuchil.currentTime=0;

  musicaBTS.pause();
  musicaBTS.currentTime=0;

  musicaF1.pause();
  musicaF1.currentTime=0;
  
musicaMorfina.loop=true;
  musicaMorfina.volume=.45;
musicaMorfina.currentTime=25;
  musicaMorfina
    .play()
    .catch(
      ()=>{
        console.log(
          'El navegador bloqueó la reproducción automática.'
        );
      }
    );

}

        juegoActivo=true;

        requestAnimationFrame(
          loop
        );


      }else{

        document.body.classList.add(
          'pintura-final'
        );

        document.getElementById(
          'victoryScreen'
        ).style.display='flex';

        lanzarConfeti();

      }

    700
  );

}

document.getElementById(    
'confetti'    
);

'💗',

];    
    
    
for(

i<50;    
i++    
){

document.createElement(    
'div'    
);

'confetti-piece';

simbolos[

'vw';

2.5+

's';    
    
el.style.animationDelay=    
Math.random()*1.2+    
's';

14+    
Math.random()*16+

'💫'    
];    
    
    
for(    
let i=0;    
i<cantidad;    
i++    
){    
    
const el=    
document.createElement(    
'div'    
);    
    
el.className='flotante';    
    
el.textContent=    
simbolos[    
Math.floor(    
Math.random()*    
simbolos.length    
)    
];

Math.random()*100+    
'vw';    
    
el.style.fontSize=

/* ============================================================    
CARTA    
============================================================ */    
    
const envelope=    
document.getElementById(    
'envelope'    
);    
    
const cartaBox=    
document.getElementById(    
'cartaBox'    
);    
    
const cartaTexto=    
document.getElementById(    
'cartaTexto'    
);    
    
    
let cartaAbierta=false;    
    
    
envelope.addEventListener(    
'click',    
()=>{    
    
if(cartaAbierta)    
return;    
    
    
cartaAbierta=true;

setTimeout(

envelope.style.display='none';

650    
);

);    
    
    
/* ============================================================    
ESCRIBIR CARTA    
============================================================ */    
    
function escribirCarta(){    
    
const texto=    
CONFIG.CARTA_TEXTO;    
    
let i=0;    
    
cartaTexto.textContent='';    
    
    
const cursor=    
document.createElement(    
'span'    
);    
    
cursor.className=    
'cursor-escritura';    
    
cursor.textContent='\u00A0';    
    
    
const intervalo=    
setInterval(    
()=>{    
    
cartaTexto.textContent=    
texto.slice(    
0,    
i    
);    
    
cartaTexto.appendChild(    
cursor    
);    
    
i++;    
    
    
cartaBox.scrollTop=    
cartaBox.scrollHeight;    
    
    
if(    
i>texto.length    
){    
    
clearInterval(intervalo);    
    
cursor.remove();    
    
    
document.getElementById(    
'cartaFirma'    
).style.opacity=1;    
    
    
const boton=    
document.getElementById(    
'volverJugar'    
);    
    
boton.classList.remove(    
'oculto'    
);    
    
requestAnimationFrame(    
()=>{    
boton.style.opacity=1;    
}    
);    
    
}    
    
},    
70   
);    
    
}

);
